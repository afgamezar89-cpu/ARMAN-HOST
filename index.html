<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arman Hosting - 100% Free Hosting</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --dark: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--dark);
            background-image: radial-gradient(circle at 50% 10%, #1a233a 0%, var(--dark) 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 13px;
            color: #9ca3af;
        }
        .badges {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.2);
        }
        .file-upload-container {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            position: relative;
            background: rgba(3, 7, 18, 0.3);
            transition: 0.3s;
            cursor: pointer;
        }
        .file-upload-container:hover {
            border-color: var(--primary);
        }
        .file-upload-container input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-label {
            font-size: 13px;
            color: #9ca3af;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: #0b0f19;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .telegram-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #229ed9;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .telegram-btn:hover {
            background: #1f8abf;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Arman Hosting</h1>
            <p>Upload your HTML code or file to get your live URL instantly.</p>
        </div>

        <div class="badges">
            <span class="badge">100% Free Hosting</span>
            <span class="badge">ARMAN123</span>
        </div>

        <form id="hostingForm">
            <div class="form-group">
                <label>Project / Site Name</label>
                <input type="text" id="projectName" placeholder="my-awesome-site" required>
            </div>

            <div class="form-group">
                <label>HTML File Upload (Optional)</label>
                <div class="file-upload-container">
                    <span class="file-label" id="fileLabel">Choose file or drag here</span>
                    <input type="file" id="htmlFile" accept=".html,.htm">
                </div>
            </div>

            <div class="form-group">
                <label>Or Paste HTML Code Here</label>
                <textarea id="htmlCode" rows="6" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>My Site</title></head>&#10;<body>&#10;  <h1>Hello World!</h1>&#10;</body>&#10;</html>"></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">Publish & Send to Arman</button>
        </form>

        <a href="https://t.me/your_telegram_channel" target="_blank" class="telegram-btn">Join Telegram</a>

        <div id="status"></div>
    </div>

    <script>
        const GITHUB_TOKEN = "ghp_1tU55QJ2I04YgA3D8IrYc0l_zAJBnK1R7mTnTCyLvIrHNv0kXs2hqFnl"; // Updated Token
        const GITHUB_USER = "afgamezar89-cpu";
        const REPO_NAME = "ARMAN-HOST"; // Your Hosting Repo

        const fileInput = document.getElementById('htmlFile');
        const fileLabel = document.getElementById('fileLabel');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = fileInput.files[0].name;
            } else {
                fileLabel.textContent = "Choose file or drag here";
            }
        });

        document.getElementById('hostingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const projectName = document.getElementById('projectName').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
            const htmlCodeInput = document.getElementById('htmlCode').value;
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            if (!projectName) {
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = 'Please enter a valid project name!';
                return;
            }

            let fileContent = "";

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileContent = await file.text();
            } else if (htmlCodeInput) {
                fileContent = htmlCodeInput;
            } else {
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = 'Please upload a file or paste HTML code!';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Publishing...';
            statusDiv.style.color = '#38bdf8';
            statusDiv.textContent = 'Uploading to Arman Hosting...';

            const filePath = `${projectName}/index.html`;
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${filePath}`;

            let sha = null;
            try {
                const getCheck = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (getCheck.ok) {
                    const data = await getCheck.json();
                    sha = data.sha;
                }
            } catch (err) {}

            const base64Content = btoa(unescape(encodeURIComponent(fileContent)));

            const bodyData = {
                message: `Deploy project: ${projectName}`,
                content: base64Content,
                branch: "main"
            };

            if (sha) {
                bodyData.sha = sha;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    const liveUrl = `https://${GITHUB_USER}.github.io/${REPO_NAME}/${projectName}/`;
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerHTML = `Success! Your site is live: <br><a href="${liveUrl}" target="_blank" style="color: #00f2fe; word-break: break-all;">${liveUrl}</a>`;
                } else {
                    const errJson = await response.json();
                    throw new Error(errJson.message || 'Upload failed');
                }
            } catch (error) {
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = 'Error: GitHub upload failed. ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish & Send to Arman';
            }
        });
    </script>
</body>
</html>
